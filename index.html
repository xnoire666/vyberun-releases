<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vyberun · The terminal workspace for AI coding agents</title>
<meta name="description" content="The terminal workspace for Windows where AI coding agents work as a team.">
<link rel="icon" href="img/logo.png">
<style>
  :root {
    --bg: #0f0f10;
    --panel: #18181a;
    --line: #2a2a2e;
    --text: #ececec;
    --muted: #9b9ba1;
  }
  * { box-sizing: border-box; }
  /* one screen, no scrolling: the page is the window's height, and the screenshot takes what's left */
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; height: auto; display: block; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* made-up terminal output scrolling slowly behind the page, faded out in the middle */
  .term-bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, transparent 25%, #000 75%);
            mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, transparent 25%, #000 75%);
  }
  .term-bg pre {
    margin: 0; padding: 0 3vw; font: 14px/1.7 "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    color: rgba(200, 200, 210, .16); white-space: pre; animation: scroll-up 90s linear infinite;
  }
  .term-bg .p { color: rgba(168, 85, 247, .35); }
  .term-bg .g { color: rgba(78, 201, 138, .32); }
  .term-bg .y { color: rgba(232, 176, 74, .32); }
  @keyframes scroll-up { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  @media (prefers-reduced-motion: reduce) { .term-bg pre { animation: none; } }

  main {
    flex: 1; min-height: 0; text-align: center;
    display: flex; align-items: center; justify-content: center; padding: 3vh 0;
  }
  main .wrap { width: 100%; }
  h1 {
    margin: 0; display: flex; flex-direction: column; align-items: center; gap: 1.6vh;
    font-size: clamp(36px, min(9vw, 9vh), 88px); line-height: 1; letter-spacing: -0.02em; font-weight: 700;
  }
  h1 img { width: clamp(64px, min(16vw, 15vh), 136px); filter: drop-shadow(0 0 40px rgba(168, 85, 247, .45)); }
  .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 4.5vh; }
  /* the manual: a quiet link in the top corner, where people look for docs; the Store is the one button */
  .top-link { position: fixed; top: 18px; right: 24px; z-index: 2; display: inline-flex; align-items: center; gap: 8px;
    font: 600 15px "Segoe UI", system-ui, sans-serif; color: var(--text); text-decoration: none;
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: rgba(24,24,26,.75); }
  .top-link svg { width: 18px; height: 18px; }
  .top-link:hover { border-color: #4a4a52; background: rgba(36,36,40,.9); }
  @media (max-width: 640px) { .top-link { top: 10px; right: 12px; } }
  /* "or" between the Store button and the winget command: two ways to the same install */
  .or { display: flex; align-items: center; gap: 12px; width: min(360px, 100%); margin: 1.8vh auto 0; color: var(--muted);
    font: 600 11px "Segoe UI", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
  .or::after { background: linear-gradient(90deg, var(--line), transparent); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 8px;
    font-weight: 600; font-size: 14px; line-height: 1.4;
    border: 1px solid var(--line); background: var(--panel);
  }
  .btn.primary { background: var(--text); color: #111; border-color: var(--text); }
  .btn.primary:hover { background: #fff; }
  .btn small { font-weight: 400; font-size: 12px; opacity: .7; }
  .note { margin: 1.2vh 0 0; font-size: 12px; color: var(--muted); }
  /* the same Store version, from a terminal: a small PowerShell window that types the command */
  .winget { display: inline-flex; flex-direction: column; margin: 1.8vh auto 0; min-width: min(360px, 100%); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #0b0b0c; text-align: left; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .winget .bar { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 10px; background: var(--panel); border-bottom: 1px solid var(--line); font: 11.5px "Segoe UI", system-ui, sans-serif; color: var(--muted); }
  .winget .bar span { margin-left: 2px; }
  .winget button { margin-left: auto; font: 11.5px "Segoe UI", system-ui, sans-serif; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 1px 8px; cursor: pointer; }
  .winget button:hover { color: var(--text); border-color: #3a3a40; }
  .winget .line { padding: 9px 12px 10px; font: 13.5px "Cascadia Code", "Cascadia Mono", Consolas, monospace; color: var(--text); white-space: nowrap; }
  .winget .ps { color: #6e6e75; }
  .winget .cur { display: inline-block; width: .55em; height: 1.1em; margin-left: 1px; background: var(--text); vertical-align: -0.2em; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .winget .cur { animation: none; } }
  .btn[aria-disabled="true"] { opacity: .55; pointer-events: none; }
  .shot {
    /* as wide as the height left over allows (16:9), never wider than 760 px or the window */
    width: min(760px, 100%, max(200px, (100vh - 330px) * 1.778));
    width: min(760px, 100%, max(200px, (100dvh - 330px) * 1.778));
    margin: 4vh auto 0; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 120px rgba(168, 85, 247, .18);
  }

  footer { flex: none; border-top: 1px solid var(--line); padding: 8px 0; color: var(--muted); font-size: 13px; line-height: 1.4; background: rgba(15,15,16,.85); }
  footer .wrap { max-width: none; display: flex; gap: 14px 26px; flex-wrap: wrap; align-items: center; }
  footer nav { display: flex; gap: 22px; flex-wrap: wrap; margin-left: auto; }
  footer a:hover { color: var(--text); }

  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .shot { border-radius: 8px; }
    footer { padding: 8px 0; font-size: 12px; }
    footer .wrap { justify-content: center; }
    footer nav { margin-left: 0; gap: 16px; }
  }
</style>
</head>
<body>
<a class="top-link" href="manual/"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5c2-.9 4-.9 6 .4 2-1.3 4-1.3 6-.4v9c-2-.9-4-.9-6 .4-2-1.3-4-1.3-6-.4z"/><path d="M8 3.9v9"/></svg>Manual</a>

<div class="term-bg" aria-hidden="true"><pre id="termText"></pre></div>

<main>
  <div class="wrap">
    <h1><img src="img/logo.png" alt="">vyberun</h1>
    <div class="cta">
      <a class="btn primary" href="https://apps.microsoft.com/detail/9MX9G62RFFQ5">Get it from the Microsoft Store</a>
    </div>
    <div class="or" aria-hidden="true">or</div>
    <div class="winget" role="group" aria-label="Install with winget">
      <div class="bar"><span>PowerShell</span><button type="button" id="copy-winget" aria-label="Copy the winget command">Copy</button></div>
      <div class="line"><span class="ps">PS C:\&gt; </span><code id="winget-cmd">winget install vyberun</code><span class="cur" aria-hidden="true"></span></div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 vyberun</span>
    <nav>
      <a href="https://github.com/xnoire666/vyberun-releases/releases">Releases</a>
      <a href="https://github.com/xnoire666/vyberun-releases/blob/main/PRIVACY.md">Privacy</a>
      <a href="https://github.com/xnoire666/vyberun-releases/blob/main/LICENSE.md">License</a>
      <a href="https://github.com/xnoire666/vyberun-releases/issues">Support</a>
    </nav>
  </div>
</footer>

<script>
  // Copy: the winget command to the clipboard
  const wingetCmd = 'winget install vyberun', cmd = document.getElementById('winget-cmd');
  document.getElementById('copy-winget').addEventListener('click', e => {
    navigator.clipboard.writeText(wingetCmd).then(() => { e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1500); }, () => {});
  });
  // the command typed as in a terminal, then left there; typed again every 12 s (not with reduced motion)
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const type = () => {
      let n = 0; cmd.textContent = '';
      const t = setInterval(() => { cmd.textContent = wingetCmd.slice(0, ++n); if (n >= wingetCmd.length) clearInterval(t); }, 70);
    };
    setTimeout(type, 600); setInterval(type, 12000);
  }  // the background's made-up output (repeated, and twice over, so the loop has no seam)
  const lines = [
    '<span class="p">PS C:\\work\\shop\\shop-api&gt;</span> git status',
    'On branch SHOP-142-checkout',
    'Changes not staged for commit:',
    '        modified:   app/Http/Controllers/CheckoutController.php',
    '',
    '<span class="p">PS C:\\work\\shop\\shop-api&gt;</span> claude',
    '<span class="y">●</span> backend · waiting for you',
    '&gt; Add a POST /checkout endpoint that validates the cart',
    '<span class="p">●</span> Reading routes/api.php',
    '<span class="p">●</span> Writing app/Http/Requests/CheckoutRequest.php',
    '<span class="g">✓</span> POST /checkout now validates the cart',
    '',
    '<span class="p">PS C:\\work\\shop\\shop-web&gt;</span> npm run dev',
    '  VITE v7.0.0  ready in 412 ms',
    '  ➜  Local:   http://localhost:5173/',
    '',
    '<span class="p">dev@shop:~/shop-api$</span> tail -f storage/logs/laravel.log',
    '[2026-11-16 09:12:03] local.INFO: checkout started {"items":2}',
    '[2026-11-16 09:12:04] local.INFO: checkout validated',
    '',
    '<span class="g">●</span> qa · done',
    '<span class="p">PS C:\\work\\shop\\shop-web&gt;</span> npm test',
    ' ✓ src/Checkout.test.jsx (4 tests) 38ms',
    ' Test Files  1 passed (1)',
    '',
    '<span class="p">PS C:\\work\\shop\\shop-api&gt;</span> git log --oneline',
    'e1f03ec (HEAD -&gt; SHOP-142-checkout, main) First version',
    ''
  ];
  const block = Array(4).fill(lines.join('\n')).join('\n');
  document.getElementById('termText').innerHTML = block + '\n' + block;
</script>

</body>
</html>
